{{- range $name, $server := .Values.issuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  acme:
    server: {{ $server }}
    privateKeySecretRef:
      name: {{ $name }}-account
    solvers:
      - selector:
          dnsZones:
            - {{ $.Values.dnsZone }}
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ $.Values.cloudflareTokenSecret.name }}
              key: {{ $.Values.cloudflareTokenSecret.key }}
{{- end }}
